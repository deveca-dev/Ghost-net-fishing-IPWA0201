<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      >
<f:view locale="de">
    <h:head>
        <title>Ghost Net Fishing – Netzübersicht</title>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <h:outputStylesheet name="css/style.css"/>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    </h:head>
    <h:body>
        <div class="seite">
            <h1>Netzübersicht</h1>
            <nav>
                <h:link value="Einstieg" outcome="index.xhtml"/>
                <h:form styleClass="nav-form">
                    <h:commandLink value="Netz melden" action="#{netzBearbeitungBean.meldeformularOeffnen}"/>
                </h:form>
            </nav>

            <p>
                Aktueller Zugang:
                <h:outputText value="Anonym" rendered="#{userContext.anonym}"/>
                <h:outputText value="#{userContext.benutzername}" rendered="#{not userContext.anonym}"/>
            </p>

            <h:form id="filter">
                <h:outputLabel for="status" value="Status"/>
                <h:selectOneMenu id="status" value="#{netzListeBean.statusFilter}">
                    <f:selectItems value="#{netzListeBean.filterOptionen}" var="option"
                                   itemValue="#{option.wert}" itemLabel="#{option.bezeichnung}"/>
                </h:selectOneMenu>
                <h:commandButton value="Filter anwenden"/>

                <details id="kartenbereich" class="kartenbereich">
                    <summary>Geisternetze auf der Karte entdecken</summary>
                
                    <p>
                        Blau: gemeldet · Grün: Bergung bevorstehend.
                        Kreise zeigen bei näherem Zoom die geschätzte Fläche,
                        keinen Suchradius.
                    </p>
                
                    <div id="netzkarte" aria-label="Positionen offener Geisternetze"></div>
                
                    <p id="kartenhinweis" role="status"></p>
                
                    <div id="kartendaten" hidden="hidden">
                        <ui:repeat value="#{netzListeBean.kartenNetze}" var="netz">
                            <div class="karten-netz">
                                <span class="karten-breite">
                                    <h:outputText value="#{netz.breitengrad}"/>
                                </span>
                
                                <span class="karten-laenge">
                                    <h:outputText value="#{netz.laengengrad}"/>
                                </span>
                
                                <span class="karten-flaeche">
                                    <h:outputText value="#{netz.geschaetzteGroesse}"/>
                                </span>
                
                                <span class="karten-status">
                                    <h:outputText value="#{netz.status}"/>
                                </span>
                
                                <span class="karten-statustext">
                                    <h:outputText
                                            value="#{netzListeBean.statusText(netz.status)}"/>
                                </span>
                
                                <h:commandLink
                                        styleClass="karten-detailaktion"
                                        value="Netzdetails öffnen"
                                        action="#{netzBearbeitungBean.netzAnzeigen(netz)}"/>
                            </div>
                        </ui:repeat>
                    </div>
                </details>

                <div class="tabelle-rahmen">
                    <h:dataTable value="#{netzListeBean.geisternetze}" var="netz"
                                 rendered="#{not empty netzListeBean.geisternetze}">
                        <h:column>
                            <f:facet name="header">Position (Breitengrad, Längengrad)</f:facet>
                            <h:outputText value="#{netz.breitengrad}"/>
                            <h:outputText value=", "/>
                            <h:outputText value="#{netz.laengengrad}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">Geschätzte Größe (m²)</f:facet>
                            <h:outputText value="#{netz.geschaetzteGroesse}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">Status</f:facet>
                            <h:outputText value="#{netzListeBean.statusText(netz.status)}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">Details</f:facet>
                            <h:commandLink value="Anzeigen" action="#{netzBearbeitungBean.netzAnzeigen(netz)}"/>
                        </h:column>
                    </h:dataTable>
                </div>
            </h:form>
        </div>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<h:outputScript library="js" name="netzkarte.js"/>
    </h:body>
</f:view>
</html>
